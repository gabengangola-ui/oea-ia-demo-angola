<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OEA FULL MODEL</title>
<style>
body{margin:0;background:#050505;color:#eee;font-family:Consolas,Menlo,Arial,sans-serif}
header{padding:12px 16px;border-bottom:1px solid #222;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
b{color:#e03c31;letter-spacing:.12em;font-size:12px}
button{background:#1a1a1a;color:#eee;border:1px solid #333;padding:8px 10px;cursor:pointer;font:inherit}
button.p{background:#e03c31;border-color:#e03c31;color:#fff;font-weight:700}
.wrap{padding:16px;max-width:1100px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:#0c0c0c;border:1px solid #222;padding:12px}
.k{color:#e03c31;font-size:11px}
.n{font-size:32px;font-weight:700}
.m{color:#888;font-size:12px;margin-top:6px}
canvas{width:100%;height:160px;background:#000;border:1px solid #222}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid #222;padding:5px;text-align:left}
.ok{color:#3dcf8a}.bad{color:#e03c31}
#ag{display:none}
@media(max-width:800px){.g{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <b>OEA FULL MODEL</b>
  <button class="p" id="tabOg">OIL GAS</button>
  <button id="tabAg">AGRO</button>
  <button class="p" id="start">ARRANCAR</button>
  <button id="fault">INJECTAR DESVIO</button>
  <button id="ack">CONFIRMAR INSPECAO</button>
</header>
<div class="wrap" id="og">
  <div class="g">
    <div class="card"><div class="k">P bar</div><div class="n" id="p">--</div></div>
    <div class="card"><div class="k">T C</div><div class="n" id="t">--</div></div>
    <div class="card"><div class="k">V mm/s</div><div class="n" id="v">--</div></div>
    <div class="card"><div class="k">max |z|</div><div class="n" id="z">--</div></div>
  </div>
  <div class="card" style="margin-top:10px"><canvas id="c" width="1000" height="160"></canvas></div>
  <p class="m" id="msg">a arrancar...</p>
  <table><thead><tr><th>ciclo</th><th>P</th><th>T</th><th>V</th><th>z</th></tr></thead><tbody id="tb"></tbody></table>
</div>
<div class="wrap" id="ag">
  <p class="m">Stress = (18 - humidade) + 0.15*(5 - chuva). Nao abre aspersor.</p>
  <p><button class="p" id="agStart">ARRANCAR AGRO</button> <button id="dry">SECA</button> <button id="rain">CHUVA 25</button></p>
  <div class="g" id="plots"></div>
  <p class="m" id="amsg"></p>
</div>
<script>
function g(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
var run=true,bias=0,ack=false,tick=0,series=[],rows=[],timer=null;
var muP=172,muT=64,muV=2.1,sdP=6.2,sdT=4.1,sdV=0.55;
function draw(){
  var c=document.getElementById('c'),x=c.getContext('2d'),w=c.width,h=c.height;
  x.clearRect(0,0,w,h);
  if(!series.length)return;
  var mx=Math.max(4.2, Math.max.apply(null,series));
  x.strokeStyle='#e03c31'; x.beginPath(); var yl=h-(3/mx)*h*0.8-10; x.moveTo(0,yl); x.lineTo(w,yl); x.stroke();
  x.strokeStyle='#fff'; x.beginPath();
  for(var i=0;i<series.length;i++){
    var X=i/(series.length-1||1)*w, Y=h-(series[i]/mx)*h*0.8-10;
    if(i)x.lineTo(X,Y); else x.moveTo(X,Y);
  }
  x.stroke();
}
function step(){
  if(!run)return;
  tick++;
  if(bias>0) bias=Math.min(1.8,bias+0.05);
  var p=muP+bias*18+g()*sdP*0.4;
  var t=muT+bias*9+g()*sdT*0.4;
  var v=muV+bias*2.4+g()*sdV*0.4;
  var z=Math.max(Math.abs((p-muP)/sdP),Math.abs((t-muT)/sdT),Math.abs((v-muV)/sdV));
  document.getElementById('p').textContent=p.toFixed(1);
  document.getElementById('t').textContent=t.toFixed(1);
  document.getElementById('v').textContent=v.toFixed(2);
  document.getElementById('z').textContent=z.toFixed(2);
  document.getElementById('z').className='n '+(z>=3?'bad':'ok');
  series.push(z); if(series.length>100)series.shift();
  draw();
  rows.unshift(tick+' | '+p.toFixed(1)+' | '+t.toFixed(1)+' | '+v.toFixed(2)+' | '+z.toFixed(2));
  rows=rows.slice(0,8);
  document.getElementById('tb').innerHTML=rows.map(function(r){return '<tr><td>'+r.replace(/ \| /g,'</td><td>')+'</td></tr>';}).join('');
  if(z>=3){
    document.getElementById('msg').innerHTML = ack ? '<span class="ok">INSPECAO CONFIRMADA. modelo nao parou a bomba.</span>' : '<span class="bad">ALERTA z>=3. espera engenheiro.</span>';
  } else {
    document.getElementById('msg').textContent='a correr. limite 3.00';
  }
}
document.getElementById('start').onclick=function(){run=true; if(!timer) timer=setInterval(step,350);};
document.getElementById('fault').onclick=function(){bias=0.8;};
document.getElementById('ack').onclick=function(){ack=true;};
document.getElementById('tabOg').onclick=function(){document.getElementById('og').style.display='block';document.getElementById('ag').style.display='none';};
document.getElementById('tabAg').onclick=function(){document.getElementById('og').style.display='none';document.getElementById('ag').style.display='block';};
var plots=[{id:'A',h:24},{id:'B',h:20},{id:'C',h:16},{id:'D',h:14},{id:'E',h:22},{id:'F',h:17}];
var rain=4;
function renderAg(){
  var html='';
  var order=plots.map(function(p){return {id:p.id,h:p.h,s:Math.max(0,18-p.h)+0.15*(5-rain)};}).sort(function(a,b){return b.s-a.s;});
  order.forEach(function(p){
    html+='<div class="card"><div class="k">TALHAO '+p.id+'</div><div class="n '+(p.h<18?'bad':'ok')+'">'+p.h.toFixed(1)+'%</div><div class="m">stress '+p.s.toFixed(2)+'</div></div>';
  });
  document.getElementById('plots').innerHTML=html;
  document.getElementById('amsg').textContent='chuva 48h '+rain.toFixed(0)+' mm. observar no terreno.';
}
document.getElementById('agStart').onclick=function(){
  setInterval(function(){
    plots.forEach(function(p){p.h=Math.min(32,Math.max(8,p.h+(rain/48)*0.3-0.4+g()*0.1));});
    if(rain>0)rain=Math.max(0,rain-0.3);
    renderAg();
  },500);
};
document.getElementById('dry').onclick=function(){rain=0;plots.forEach(function(p){p.h=Math.max(8,p.h-3);});renderAg();};
document.getElementById('rain').onclick=function(){rain=25;renderAg();};
renderAg();
timer=setInterval(step,350);
</script>
</body>
</html>
